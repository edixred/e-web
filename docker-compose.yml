#version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: linguaread-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linguaread}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linguaread_password}
      POSTGRES_DB: ${POSTGRES_DB:-linguaread}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linguaread}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linguaread-network

  redis:
    image: redis:7-alpine
    container_name: linguaread-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linguaread-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linguaread-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linguaread}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linguaread_password}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-linguaread}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linguaread-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linguaread-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - linguaread-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  linguaread-network:
    driver: bridge
